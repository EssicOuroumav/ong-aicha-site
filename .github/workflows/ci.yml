name: Vérifications

# À chaque envoi et chaque demande de fusion : typage, règles de code, tests et construction du site.
# Aucun secret n'est utilisé : le site se construit avec de fausses valeurs, il ne contacte aucune base.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fausses valeurs pour tout le travail : l'installation elle-même (prisma generate) lit la configuration de la base.
    env:
      DEV_DATABASE_URL: postgresql://factice:factice@localhost:5432/factice
      DATABASE_URL: postgresql://factice:factice@localhost:5432/factice
      AUTH_SECRET: secret-factice-pour-la-construction
      NEXT_PUBLIC_SITE_URL: https://exemple.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Les 4 alertes « high » connues viennent de l'outillage Prisma (mysql2), absent à l'exécution : seules les alertes critiques bloquent.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
